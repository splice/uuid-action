name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify dist/ is up to date
        run: |
          npm run build
          if ! git diff --exit-code dist/; then
            echo "::error::dist/ is out of sync with index.js. Run 'npm run build' and commit the result."
            exit 1
          fi
